<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberBooks - Logowanie i Rejestracja</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        /* =========================================================
           CYBERBOOKS - JASNY MOTYW
        ========================================================= */

        :root {
            --bg-main: #f5f6fa;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-input: #f8f9fc;

            --text-main: #20242d;
            --text-secondary: #4b5563;
            --text-muted: #7b8494;

            --border-color: #e7e9ef;
            --border-hover: #d8dbe5;

            --accent-primary: #7c3aed;
            --accent-secondary: #6366f1;
            --accent-pink: #ec4899;

            --accent-gradient:
                linear-gradient(
                    135deg,
                    #6366f1 0%,
                    #7c3aed 45%,
                    #ec4899 100%
                );

            --accent-light: rgba(124, 58, 237, 0.08);

            --shadow-card:
                0 20px 60px rgba(31, 35, 50, 0.10);

            --shadow-button:
                0 10px 25px rgba(124, 58, 237, 0.20);
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(99, 102, 241, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(236, 72, 153, 0.07),
                    transparent 30%
                ),
                var(--bg-main);

            color: var(--text-main);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            overflow-x: hidden;
        }


        /* =========================================================
           DELIKATNE TŁO
        ========================================================= */

        body::before {
            content: "";
            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(124, 58, 237, 0.08),
                    transparent 70%
                );

            top: -180px;
            left: -180px;

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(236, 72, 153, 0.07),
                    transparent 70%
                );

            right: -180px;
            bottom: -180px;

            pointer-events: none;
        }


        /* =========================================================
           GŁÓWNY PANEL
        ========================================================= */

        .auth-container {

            width: 100%;
            max-width: 440px;

            background: var(--bg-card);

            border: 1px solid var(--border-color);

            border-radius: 24px;

            padding: 40px;

            box-shadow: var(--shadow-card);

            position: relative;

            z-index: 2;

            animation: cardAppear 0.55s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .auth-logo {

            text-align: center;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: 0.5px;

            background: var(--accent-gradient);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 32px;
        }


        /* =========================================================
           ZAKŁADKI
        ========================================================= */

        .tabs {

            display: flex;

            gap: 5px;

            background: #f1f2f6;

            border-radius: 14px;

            padding: 5px;

            margin-bottom: 28px;

            border: 1px solid #e8e9ef;
        }


        .tab-btn {

            flex: 1;

            border: none;

            background: transparent;

            color: var(--text-muted);

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            padding: 11px 15px;

            border-radius: 10px;

            transition:
                color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }


        .tab-btn:hover {

            color: var(--text-main);
        }


        .tab-btn.active {

            color: var(--accent-primary);

            background: white;

            box-shadow:
                0 3px 10px rgba(30, 35, 50, 0.08);
        }


        /* =========================================================
           ALERT
        ========================================================= */

        .alert {

            padding: 12px 14px;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 20px;

            display: none;
        }


        .alert-error {

            background: #fff1f2;

            color: #dc2626;

            border: 1px solid #fecdd3;
        }


        .alert-success {

            background: #ecfdf5;

            color: #059669;

            border: 1px solid #a7f3d0;
        }


        /* =========================================================
           FORMULARZ
        ========================================================= */

        .form-panel {

            display: none;
        }


        .form-panel.active {

            display: block;

            animation: panelAppear 0.25s ease;
        }


        @keyframes panelAppear {

            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .input-group {

            display: flex;

            flex-direction: column;

            gap: 7px;

            margin-bottom: 20px;
        }


        .input-group label {

            color: var(--text-secondary);

            font-size: 13px;

            font-weight: 600;
        }


        .input-group input {

            width: 100%;

            height: 48px;

            background: var(--bg-input);

            border: 1px solid var(--border-color);

            border-radius: 12px;

            padding: 0 15px;

            color: var(--text-main);

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .input-group input::placeholder {

            color: #a4aab7;
        }


        .input-group input:hover {

            border-color: var(--border-hover);

            background: white;
        }


        .input-group input:focus {

            background: white;

            border-color: var(--accent-primary);

            box-shadow:
                0 0 0 4px rgba(124, 58, 237, 0.08);
        }


        /* =========================================================
           PRZYCISK
        ========================================================= */

        .btn-submit {

            width: 100%;

            height: 49px;

            border: none;

            border-radius: 12px;

            background: var(--accent-gradient);

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 6px;

            box-shadow: var(--shadow-button);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                opacity 0.25s ease;
        }


        .btn-submit:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(124, 58, 237, 0.25);
        }


        .btn-submit:active {

            transform: translateY(0);
        }


        .btn-submit:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =========================================================
           POWRÓT
        ========================================================= */

        .back-link {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            margin-top: 25px;

            color: var(--text-muted);

            text-decoration: none;

            font-size: 13px;

            font-weight: 500;

            transition:
                color 0.25s ease;
        }


        .back-link:hover {

            color: var(--accent-primary);
        }


        /* =========================================================
           MAŁY TEKST POD FORMULARZEM
        ========================================================= */

        .auth-info {

            text-align: center;

            margin-top: 20px;

            font-size: 11px;

            line-height: 1.5;

            color: #9aa1ae;
        }


        /* =========================================================
           RESPONSYWNOŚĆ
        ========================================================= */

        @media (max-width: 500px) {

            body {

                padding: 18px;
            }


            .auth-container {

                padding: 30px 22px;

                border-radius: 20px;
            }


            .auth-logo {

                font-size: 27px;

                margin-bottom: 27px;
            }


            .tabs {

                margin-bottom: 24px;
            }
        }


        @media (max-width: 360px) {

            .auth-container {

                padding: 25px 18px;
            }


            .auth-logo {

                font-size: 25px;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            * {

                scroll-behavior: auto !important;

                animation-duration: 0.01ms !important;

                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>


<body>

    <div class="auth-container">

        <!-- LOGO -->

        <div class="auth-logo">
            CyberBooks
        </div>


        <!-- ZAKŁADKI -->

        <div class="tabs">

            <button
                class="tab-btn active"
                id="tab-login"
                type="button"
            >
                Logowanie
            </button>


            <button
                class="tab-btn"
                id="tab-register"
                type="button"
            >
                Rejestracja
            </button>

        </div>


        <!-- KOMUNIKAT -->

        <div
            class="alert alert-error"
            id="auth-alert"
        ></div>


        <!-- =====================================================
             LOGOWANIE
        ====================================================== -->

        <div
            class="form-panel active"
            id="panel-login"
        >

            <form id="login-form">

                <div class="input-group">

                    <label for="login-email">
                        Adres e-mail
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="twoj-email@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="login-password">
                        Hasło
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Zaloguj się
                </button>

            </form>

        </div>


        <!-- =====================================================
             REJESTRACJA
        ====================================================== -->

        <div
            class="form-panel"
            id="panel-register"
        >

            <form id="register-form">

                <div class="input-group">

                    <label for="register-email">
                        Adres e-mail
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="twoj-email@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="register-password">
                        Hasło
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Min. 6 znaków"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Utwórz konto
                </button>

            </form>

        </div>


        <!-- POWRÓT -->

        <a
            href="index.html"
            class="back-link"
        >
            ← Wróć do platformy
        </a>


        <div class="auth-info">
            Twoje konto pozwala korzystać z funkcji CyberBooks
            i synchronizować dane między urządzeniami.
        </div>

    </div>


    <!-- TWÓJ DOTYCHCZASOWY SYSTEM LOGOWANIA -->

    <script
        type="module"
        src="logowanie.js"
    ></script>


    <!-- OBSŁUGA ZAKŁADEK -->

    <script>

        const tabLogin =
            document.getElementById("tab-login");

        const tabRegister =
            document.getElementById("tab-register");

        const panelLogin =
            document.getElementById("panel-login");

        const panelRegister =
            document.getElementById("panel-register");


        function showLogin() {

            tabLogin.classList.add("active");
            tabRegister.classList.remove("active");

            panelLogin.classList.add("active");
            panelRegister.classList.remove("active");
        }


        function showRegister() {

            tabRegister.classList.add("active");
            tabLogin.classList.remove("active");

            panelRegister.classList.add("active");
            panelLogin.classList.remove("active");
        }


        tabLogin.addEventListener(
            "click",
            showLogin
        );


        tabRegister.addEventListener(
            "click",
            showRegister
        );

    </script>

</body>
</html>
